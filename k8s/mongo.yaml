apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wheel-mongo-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wheel-mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wheel-mongo
  template:
    metadata:
      labels:
        app: wheel-mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-storage
              mountPath: /data/db
      volumes:
        - name: mongo-storage
          persistentVolumeClaim:
            claimName: wheel-mongo-data
---
apiVersion: v1
kind: Service
metadata:
  name: wheel-mongo
spec:
  selector:
    app: wheel-mongo
  ports:
    - port: 27017
      targetPort: 27017
