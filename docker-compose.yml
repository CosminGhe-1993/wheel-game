services:
  mongo:
    image: mongo:7
    ports:
      - "27020:27017"
    volumes:
      - mongo-data:/data/db
  backend:
    build: ./backend
    ports:
      - "5012:5012"
    environment:
      - MongoDb__ConnectionString=mongodb://mongo:27017
      - GroqApiKey=${GROQ_API_KEY}
    depends_on:
      - mongo
  frontend:
    build: ./frontend
    ports:
      - "8083:80"

volumes:
  mongo-data: